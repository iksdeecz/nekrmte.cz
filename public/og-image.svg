  <text x="120" y="220" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#06384c">Nekrmte.cz</text>
  <text x="120" y="310" font-family="system-ui, sans-serif" font-size="44" fill="#13222c">Pes snědl něco nevhodného?</text>
